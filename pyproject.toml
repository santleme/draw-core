[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draw-core"
version = "0.1.0"
description = "Draw: webcam + paper -> real-time digital ink. Runtime engine."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python-headless>=4.8,<5.1",
    "onnxruntime>=1.17",
    # Fio DRAL + handshake compartilhado, extraido para consumidores que
    # nao precisam do runtime de inferencia (packages/draw-dral).
    # Versao exata: o membro e versionado junto com o draw-core (mesmo
    # commit, mesmo numero) — um pino que nao bate com o membro falha
    # na resolucao do workspace, o que e o alarme de dessincronia.
    "draw-dral==0.1.0",
]

[project.optional-dependencies]
hand = ["mediapipe>=0.10"]
# Janela na tela (cv2.imshow): a roda com GUI substitui a headless.
gui = ["opencv-contrib-python>=4.8,<5.1"]
dev = [
    "pytest>=8",
    "pytest-testmon>=2.3.1",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "onnx>=1.16",
]

[project.scripts]
draw = "draw.app:main"

# lab/ e ferramenta de desenvolvimento (simulador/metricas), usada
# a partir da raiz do repositorio — ex.: python -m lab.sim_source.
# Nao faz parte da distribuicao; o pythonpath do pytest abaixo so
# existe para os testes importarem lab.
[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
draw-dral = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests with threads/real time; run serialized",
    "timing: wall-clock budgets; run serialized (xdist contention skews them)",
]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
faulthandler_timeout = 120

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "lab", "tools", "packages/draw-dral/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
