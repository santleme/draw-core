[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draw-dral"
version = "0.1.0"
description = "DRAL wire protocol: confirmed-ink stream plus the shared token handshake of the Draw ecosystem."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
