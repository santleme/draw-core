<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">Fluxo de validação por pares</title><desc id="d">Condições correspondentes são comparadas e o escopo das conclusões é documentado.</desc><rect width="1200" height="350" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Comparação e delimitação da evidência</text><rect x="45" y="125" width="245" height="85" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="167.5" y="172.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Condição definida</text><rect x="330" y="125" width="245" height="85" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="452.5" y="172.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Pares por condição</text><line x1="294" y1="167.5" x2="326" y2="167.5" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="615" y="125" width="245" height="85" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="737.5" y="172.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Concordância</text><line x1="579" y1="167.5" x2="611" y2="167.5" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="900" y="125" width="245" height="85" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="1022.5" y="172.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Limites relatados</text><line x1="864" y1="167.5" x2="896" y2="167.5" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><text x="600" y="290" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">A comparação avalia evidência, não o processo de geração</text></svg>
