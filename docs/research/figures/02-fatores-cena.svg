<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Matriz conceitual de compatibilidade</title><desc id="d">Matriz vazia entre categorias de arquivo e usos, sem resultados declarados.</desc><rect width="1200" height="620" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Fatores de cena na avaliação da página</text><rect x="65" y="105" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="215.0" y="150.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Iluminação</text><text x="215.0" y="170.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">uniforme ou com sombra</text><rect x="450" y="105" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="600.0" y="150.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Oclusão</text><text x="600.0" y="170.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">livre ou parcialmente encoberta</text><rect x="835" y="105" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="985.0" y="150.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Enquadramento</text><text x="985.0" y="170.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">centrado ou junto à borda</text><text x="600" y="255" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#647178" text-anchor="middle">Rótulos esquemáticos; cada variação exige cena anotada</text></svg>
