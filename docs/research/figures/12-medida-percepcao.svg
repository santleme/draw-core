<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">Modelo conceitual de medida e percepção</title><desc id="d">Observação externa e relato subjetivo são relacionados para análise sem indicar mecanismo interno ou causalidade.</desc><rect width="1200" height="350" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Medida externa e percepção relatada</text><rect x="45" y="115" width="315" height="86" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="202.5" y="163.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Comportamento observável</text><rect x="415" y="115" width="315" height="86" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="572.5" y="163.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Medida técnica</text><line x1="364" y1="158.0" x2="411" y2="158.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><rect x="785" y="115" width="315" height="86" rx="12" fill="#FFFFFF" stroke="#7869A6" stroke-width="2"/><text x="942.5" y="163.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Percepção relatada</text><line x1="734" y1="158.0" x2="781" y2="158.0" stroke="#647178" stroke-width="2" marker-end="url(#a)"/><text x="600" y="285" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#647178" text-anchor="middle">Associação investigada, sem afirmar causalidade</text></svg>
