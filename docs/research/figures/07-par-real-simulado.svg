<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Par conceitual real e simulado</title><desc id="d">Duas cenas esquemáticas para ilustrar comparação por condição, sem dados observados.</desc><rect width="1200" height="390" rx="20" fill="#F4F6F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647178"/></marker></defs><text x="40" y="44" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25333A" text-anchor="start">Par de condições para comparação</text><rect x="70" y="105" width="470" height="180" rx="12" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><text x="305.0" y="195.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Captura real</text><text x="305.0" y="215.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">exemplo esquemático</text><rect x="660" y="105" width="470" height="180" rx="12" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><text x="895.0" y="195.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#25333A" text-anchor="middle">Cena simulada</text><text x="895.0" y="215.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#647178" text-anchor="middle">exemplo esquemático</text><text x="600" y="345" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#647178" text-anchor="middle">Comparar a mesma pergunta, documentando diferenças da cena</text><rect x="150" y="155" width="300" height="82" rx="4" fill="#FFFFFF" stroke="#3E6F78" stroke-width="2"/><path d="M185 210 L240 185 L310 218 L402 175" fill="none" stroke="#647178" stroke-width="3"/><rect x="740" y="155" width="300" height="82" rx="4" fill="#FFFFFF" stroke="#A76C4E" stroke-width="2"/><path d="M775 210 L830 185 L900 218 L992 175" fill="no