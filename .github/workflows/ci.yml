name: ci

on:
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -n auto --dist worksteal -m "not slow"
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"

  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: pytest -q -m slow
